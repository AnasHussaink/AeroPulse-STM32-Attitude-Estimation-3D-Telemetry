name: Repository quality

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source syntax, local documentation links and conflict markers
        run: python tools/check_repository.py
      - name: Check Python correctness
        run: |
          python -m pip install ruff==0.11.13
          ruff check .
      - name: Install C/C++ tools
        run: |
          python -m pip install clang-format==18.1.8
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Enforce application formatting
        run: python tools/format_sources.py --check
      - name: Analyze application sources
        run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unmatchedSuppression --language=c --std=c11 -DUSE_HAL_DRIVER -DSTM32F103xB -Ifirmware/Core/Inc firmware/Core/Src/main.c firmware/Core/Src/lcd_i2c.c
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
      - run: cmake -S firmware -B build/firmware -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/firmware
