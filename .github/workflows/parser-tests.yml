name: Parser tests
on: [push, pull_request]
jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest host/tests/test_parser.py -q
        env:
          PYTHONPATH: host/src
